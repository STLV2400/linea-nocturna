<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>ESTUDIO — Personajes de Línea Nocturna</title>
<style>body{margin:0;background:#000;overflow:hidden;font-family:'Segoe UI',system-ui}canvas{display:block}
#ui{position:fixed;top:12px;left:12px;background:rgba(6,10,16,.88);border:1px solid #2d4a6a;border-radius:8px;color:#bcd3ea;padding:12px 14px;width:270px;font-size:12px}
#ui h3{margin:0 0 6px;color:#e3f0ff;letter-spacing:2px;font-size:14px}#ui button{width:100%;margin:3px 0;background:#122033;color:#cfe3ff;border:1px solid #2d4a6a;border-radius:4px;padding:6px;cursor:pointer;text-align:left}
#ui button.on{background:#4a1010;border-color:#c33}#ui p{color:#8aa3bd;margin:8px 0 0}#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#888;letter-spacing:4px}</style></head><body>
<div id="load">CARGANDO HUÉSPEDES…</div>
<div id="ui"><h3>👁 PERSONAJES</h3>
<button data-k="novia">👰 La Novia — ahogada, ojos lechosos</button><button data-k="operadora">📞 La Operadora — estrangulada con el cable</button>
<button data-k="nina">🧸 La Niña Clara — ojos negros</button><button data-k="botones">🛎️ El Botones — cuello roto, llave 404</button>
<button data-k="quemado">🔥 El Quemado — carbonizado, con brasas</button><button data-k="todos">👥 Ver a los cinco</button>
<button id="luz">🔦 Linterna / luz de trabajo</button>
<p>Arrastra para girar · rueda para acercar</p></div>
<script src="lib/r147_three.min.js"></script><script src="lib/r147_fflate.min.js"></script><script src="lib/r147_NURBSUtils.js"></script><script src="lib/r147_NURBSCurve.js"></script><script src="lib/r147_FBXLoader.js"></script><script src="lib/r147_SkeletonUtils.js"></script><script src="lib/r147_BufferGeometryUtils.js"></script>
<script src="assets/r_novia.js"></script><script src="assets/r_operadora.js"></script><script src="assets/r_nina.js"></script><script src="assets/r_botones.js"></script><script src="assets/r_quemado.js"></script>
<script src="personajes/harness.js"></script><script src="personajes/chars.js"></script>
<script>
S.background=new THREE.Color(0x020203); S.fog=new THREE.FogExp2(0x020203,.12);
S.children.filter(o=>o.isLight).forEach(l=>S.remove(l));
const hemi=new THREE.HemisphereLight(0x35425a,0x080606,.25); S.add(hemi);
const key=new THREE.SpotLight(0xd8e4ff,6,12,.45,.6,1.5); key.position.set(-1.2,3.2,2.2); key.castShadow=true; S.add(key,key.target);
const rim=new THREE.PointLight(0x8a1010,1.2,6,2); rim.position.set(.8,1.6,-1.2); S.add(rim);
const work=new THREE.HemisphereLight(0xffffff,0x444444,0); S.add(work);
let all=[], th=0, ph=1.45, dist=3.2, ty=1.2, drag=false, lx=0, ly=0, mode='novia';
function show(k){mode=k; document.querySelectorAll('[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  all.forEach((e,i)=>{const solo=k!=='todos'; e.visible=!solo||e.userData.kind===k; e.position.set(solo?0:(i-2)*1.15,0,0); e.rotation.y=0;});
  dist=k==='todos'?6.5:2.6; ty=k==='todos'?1.1:(k==='nina'?.85:1.3); th=0;}
loadHumans().then(()=>{all=['novia','operadora','nina','botones','quemado'].map(k=>{const e=makeEnemy(k); S.add(e); return e;});
  document.getElementById('load').remove(); show('novia');
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>show(b.dataset.k));
  document.getElementById('luz').onclick=e=>{work.intensity=work.intensity?0:1.1; e.target.classList.toggle('on');};
  const c=R.domElement; c.onpointerdown=e=>{drag=true; lx=e.clientX; ly=e.clientY;}; onpointerup=()=>drag=false;
  c.onpointermove=e=>{if(!drag) return; th-=(e.clientX-lx)*.008; ph=Math.min(2.2,Math.max(.6,ph-(e.clientY-ly)*.006)); lx=e.clientX; ly=e.clientY;};
  c.onwheel=e=>{dist=Math.min(10,Math.max(.8,dist*Math.pow(1.001,e.deltaY)));};
  const clk=new THREE.Clock(); (function loop(){const dt=Math.min(clk.getDelta(),.05), t=clk.elapsedTime; enemyTick(t,dt);
    key.intensity=6*(Math.random()<.015?.15:1); rim.intensity=1+Math.sin(t*1.7)*.3;
    cam.position.set(Math.sin(th)*dist*Math.sin(ph),ty+Math.cos(ph)*dist,Math.cos(th)*dist*Math.sin(ph)); cam.lookAt(0,ty,0); R.render(S,cam); requestAnimationFrame(loop);})();
  window.__ready=true;});
onresize=()=>{R.setSize(innerWidth,innerHeight); cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix();};
</script></body></html>
